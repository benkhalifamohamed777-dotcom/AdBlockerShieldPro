
name: Build AdBlocker Shield Pro

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockerShieldPro-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
